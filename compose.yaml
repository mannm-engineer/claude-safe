# Chạy Claude Code trong container, dùng nguyên Dockerfile và init-firewall.sh của Anthropic (thư mục anthropic/)
# (https://github.com/anthropics/claude-code/tree/52c76441cae91f6891e4712306bffb057ff6fec5/.devcontainer).
# File này thay cho devcontainer.json của họ: cùng image, cùng user, cùng volume, cùng firewall, không cần IDE.
#
# Cài (một lần trên mỗi máy, chạy lại để cập nhật): install.sh (macOS, Linux, Windows dùng Git Bash).
# Dùng: đứng ở thư mục gốc của project, gõ claude-safe. Bí danh này chạy:
#   docker compose -f <thư mục cài>/compose.yaml --env-file <thư mục cài>/compose.env --project-directory . run --rm claude
# Tên project (tiền tố tên volume, mỗi project một volume đăng nhập và session) là tên thư mục project, do Compose tự
# lấy và chuẩn hóa. --env-file thay cho .env của project, vì COMPOSE_PROJECT_NAME trong đó sẽ đổi tên project, tức là
# gắn volume của project khác. Lệnh trần thiếu --env-file thì Compose báo lỗi thiếu CLAUDE_SAFE_HOME.
# Mọi session đều được ghi lịch sử: thay đổi trong ~/.claude được commit vào git trên máy thật (xem history/).
# Trong container: claude (hoặc claude --dangerously-skip-permissions); hoặc vào thẳng: claude-safe claude --resume.
# Nhiều cửa sổ cho cùng một project: mỗi cửa sổ chạy lại lệnh trên, mỗi cửa sổ là một container riêng, dùng chung volume
# của project (đăng nhập, session). Các cửa sổ không gọi được localhost của nhau.

services:
  claude:
    # Image build riêng bằng docker build (install.sh làm việc này), dùng chung cho mọi project.
    image: claude-safe
    # Không bao giờ tự tải: chưa build thì báo lỗi "No such image". Không đặt thì Compose tự tải
    # docker.io/library/claude-safe từ Docker Hub.
    pull_policy: never
    cap_add: [NET_ADMIN, NET_RAW]   # devcontainer.json: runArgs (firewall cần)
    user: node                      # devcontainer.json: remoteUser
    working_dir: /workspace         # devcontainer.json: workspaceFolder
    volumes:
      - .:/workspace                        # devcontainer.json: workspaceMount ("." = --project-directory)
      - claude-config:/home/node/.claude    # devcontainer.json: claude-code-config-${devcontainerId}
      - claude-commandhistory:/commandhistory   # devcontainer.json: claude-code-bashhistory-${devcontainerId}
      # Không có trong bản gốc: ghi lịch sử. Hook chỉ đọc, Claude trong container không sửa được. Đường dẫn tuyệt đối
      # lấy từ compose.env, vì đường dẫn tương đối tính từ thư mục project, không phải thư mục cài.
      - ${CLAUDE_SAFE_HOME:?thiếu --env-file <thư mục cài>/compose.env}/history/managed-settings.json:/etc/claude-code/managed-settings.json:ro
      - ${CLAUDE_SAFE_HOME}/history/hook-commit.sh:/usr/local/bin/hook-commit.sh:ro
      # Thư mục lịch sử nằm ngoài thư mục cài, vì cài lại sẽ xóa thư mục cài. Script cài tạo sẵn nó: nếu để Docker tự
      # tạo, thư mục thuộc root, quyền 755, và hook (user node) không ghi được.
      - ${CLAUDE_SAFE_HISTORY:?thiếu --env-file <thư mục cài>/compose.env}:/history
    environment:                            # devcontainer.json: containerEnv
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      # Không có trong bản gốc: hook ghi lịch sử đặt repo theo project (mọi project đều ở /workspace).
      CLAUDE_HISTORY_PROJECT: ${COMPOSE_PROJECT_NAME}
      # Không có trong bản gốc (bản gốc ghi TZ vào image lúc build, mặc định America/Los_Angeles): đặt lúc chạy thì
      # ghi đè giá trị trong image, đổi múi giờ không cần build lại. Sai múi giờ thì Claude thấy sai ngày, git và log
      # ghi sai giờ.
      TZ: Asia/Ho_Chi_Minh
      # Không có trong bản gốc: Claude Code (cài bằng npm, thư mục do node sở hữu) tự cập nhật vào lớp ghi của
      # container, mà run --rm xóa mất, nên lần chạy sau lại tải lại. Cập nhật bằng cách build lại image.
      DISABLE_AUTOUPDATER: "1"
      # Không có trong devcontainer.json vì công cụ devcontainer tự làm: thư mục project gắn từ máy thật có chủ sở hữu
      # khác user node (trên Windows hiện là root), nên git từ chối mọi lệnh với "detected dubious ownership". Đánh dấu
      # thư mục project là an toàn, qua biến môi trường thay cho ~/.gitconfig.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    # devcontainer.json: postStartCommand + waitFor. Đặt ở entrypoint chứ không ở command: lệnh truyền vào
    # "run --rm claude <lệnh>" thay thế command, nên firewall đặt ở command sẽ bị bỏ qua. Firewall lỗi thì && dừng,
    # lệnh không chạy. ($$ là $ sau khi Compose xử lý biến.)
    entrypoint: ["bash", "-c", "sudo /usr/local/bin/init-firewall.sh && exec \"$$@\"", "--"]
    command: ["zsh"]

# Tên có tiền tố claude- vì tên project là tên thư mục: nếu chính project cũng dùng Compose (cùng tên project) và có
# volume tên config, hai bên sẽ dùng chung volume.
volumes:
  claude-config:
  claude-commandhistory:
