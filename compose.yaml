# Chạy Claude Code trong container, dùng nguyên Dockerfile và init-firewall.sh của Anthropic (thư mục anthropic/)
# (https://github.com/anthropics/claude-code/tree/52c76441cae91f6891e4712306bffb057ff6fec5/.devcontainer).
# File này thay cho devcontainer.json của họ: cùng image, cùng user, cùng volume, cùng firewall, không cần IDE.
#
# Cách dùng: đặt hai biến môi trường, rồi
#   docker compose -f <đường dẫn tới file này> up -d --wait       mở project (chờ firewall chạy xong)
#   docker compose -f <đường dẫn tới file này> exec claude zsh    vào container, mỗi cửa sổ một lần
#   docker compose -f <đường dẫn tới file này> down               khi xong (volume vẫn giữ đăng nhập và session)
#     PROJECT_DIR   đường dẫn tới thư mục project
#     PROJECT_NAME  tên riêng của project (chữ thường, số, '-', '_'; ví dụ shop): đặt tên volume đăng nhập và session
# Trong container: claude (hoặc claude --dangerously-skip-permissions).
# Nhiều cửa sổ cho cùng một project: mỗi cửa sổ exec vào cùng một container.

# Tên project của Compose, cũng là tiền tố tên volume: mỗi project một volume ~/.claude (đăng nhập, session, memory),
# như ${devcontainerId} của devcontainer.json. Mỗi project mới phải onboarding và đăng nhập một lần.
# Không đặt thì Compose lấy tên thư mục chứa file này cho mọi project, và mọi project dùng chung một volume.
name: claude-${PROJECT_NAME:?đặt biến môi trường PROJECT_NAME (tên riêng của project, ví dụ shop)}

services:
  claude:
    build:
      context: anthropic
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: 0.18.2
        ZSH_IN_DOCKER_VERSION: 1.2.0
    # Như devcontainer: build mỗi lần mở (nhờ cache nên nhanh), nên thấy ngay Dockerfile đã sửa; không bao giờ tải
    # image từ registry. Mặc định (missing) thì chỉ build khi chưa có image, và còn thử tải image cùng tên trước.
    pull_policy: build
    cap_add: [NET_ADMIN, NET_RAW]   # devcontainer.json: runArgs (firewall cần)
    user: node                      # devcontainer.json: remoteUser
    working_dir: /workspace         # devcontainer.json: workspaceFolder
    volumes:
      - ${PROJECT_DIR:?đặt biến môi trường PROJECT_DIR (thư mục project)}:/workspace   # workspaceMount
      - config:/home/node/.claude           # devcontainer.json: claude-code-config-${devcontainerId}
      - commandhistory:/commandhistory      # devcontainer.json: claude-code-bashhistory-${devcontainerId}
    environment:                            # devcontainer.json: containerEnv
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      # Không có trong devcontainer.json vì công cụ devcontainer tự làm: thư mục project gắn từ máy thật có chủ sở hữu
      # khác user node (trên Windows hiện là root), nên git từ chối mọi lệnh với "detected dubious ownership". Đánh dấu
      # thư mục project là an toàn, qua biến môi trường thay cho ~/.gitconfig.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    # devcontainer.json: postStartCommand + waitFor. Firewall chạy khi container khởi động; lỗi hay không thì container
    # vẫn chạy tiếp, như postStartCommand. Chạy xong thì ghi /tmp/poststart-done; healthcheck cộng "up --wait" chờ
    # file này, như waitFor.
    command: ["bash", "-c", "sudo /usr/local/bin/init-firewall.sh; touch /tmp/poststart-done; exec sleep infinity"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/poststart-done"]
      interval: 2s
      retries: 60

volumes:
  config:
  commandhistory:
